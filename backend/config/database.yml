default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "lms" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "lms_dev_password" } %>

development:
  <<: *default
  database: lms_development

test:
  <<: *default
  database: lms_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
